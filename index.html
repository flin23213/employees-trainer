<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <script>
      // Apply the saved theme before CSS and the first browser paint.
      (function () {
        var theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
        } catch (_) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <style>html{background:#f5f6f8;color-scheme:light}html[data-theme="dark"]{background:#0f1115;color-scheme:dark}</style>
    <title>Тренажёр сотрудников</title>
    <meta name="description" content="Личный тренажёр: ФИО, должности и обязанности сотрудников офиса" />

    <!-- Значок вкладки -->
    <link rel="icon" type="image/png" href="/favicon-64.png" />

    <!-- Паспорт приложения -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Цвет строки состояния: разный для светлой и тёмной темы -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#4f46e5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1115" />

    <!-- Настройки специально для iPhone -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Сотрудники" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
